name: fuelguard

x-app: &app
  build: .
  env_file: .env
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  db:
    image: postgres:16-alpine
    env_file: .env
    ports:
      - "127.0.0.1:5442:5432"
    volumes:
      - fuelguard_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Identity provider (OAuth2 / OpenID Connect). Development mode with its built-in H2 database:
  # fine for running locally, not for production. The realm (clients, roles, users) is imported
  # from keycloak/fuelguard-realm.json; passwords and the terminal secret come from .env.
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      # Tokens always carry this issuer, however Keycloak is reached (browser or container network).
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      TERMINAL_CLIENT_SECRET: ${TERMINAL_CLIENT_SECRET}
      MANAGER_PASSWORD: ${MANAGER_PASSWORD}
      AUDITOR_PASSWORD: ${AUDITOR_PASSWORD}
    ports:
      - "127.0.0.1:8180:8080"
    volumes:
      - ./keycloak/fuelguard-realm.json:/opt/keycloak/data/import/fuelguard-realm.json:ro
    healthcheck:
      test:
        - CMD-SHELL
        - |
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status": "UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  api:
    <<: *app
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "127.0.0.1:8010:8000"

  worker:
    <<: *app
    command: celery -A app.workers.celery_app worker --loglevel=INFO

  beat:
    <<: *app
    command: celery -A app.workers.celery_app beat --loglevel=INFO --schedule /tmp/celerybeat-schedule

  # Run with: docker compose run --rm --build tests
  # Uses its own database (fuelguard_test) on the same Postgres container and never
  # touches Redis, so it cannot disturb the data or queue of the running app.
  tests:
    profiles: ["test"]
    build:
      context: .
      args:
        REQUIREMENTS: requirements-dev.txt
    env_file: .env
    environment:
      DATABASE_URL_ASYNC: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/fuelguard_test
      DATABASE_URL_SYNC: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/fuelguard_test
      REDIS_URL: redis://127.0.0.1:1/0
    depends_on:
      db:
        condition: service_healthy
    command: pytest

volumes:
  fuelguard_pgdata:
