name: fuelguard

x-app: &app
  build: .
  env_file: .env
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  db:
    image: postgres:16-alpine
    env_file: .env
    ports:
      - "127.0.0.1:5442:5432"
    volumes:
      - fuelguard_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    <<: *app
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "127.0.0.1:8010:8000"

  worker:
    <<: *app
    command: celery -A app.workers.celery_app worker --loglevel=INFO

  beat:
    <<: *app
    command: celery -A app.workers.celery_app beat --loglevel=INFO --schedule /tmp/celerybeat-schedule

  # Run with: docker compose run --rm --build tests
  # Uses its own database (fuelguard_test) on the same Postgres container and never
  # touches Redis, so it cannot disturb the data or queue of the running app.
  tests:
    profiles: ["test"]
    build:
      context: .
      args:
        REQUIREMENTS: requirements-dev.txt
    env_file: .env
    environment:
      DATABASE_URL_ASYNC: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/fuelguard_test
      DATABASE_URL_SYNC: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/fuelguard_test
      REDIS_URL: redis://127.0.0.1:1/0
    depends_on:
      db:
        condition: service_healthy
    command: pytest

volumes:
  fuelguard_pgdata:
